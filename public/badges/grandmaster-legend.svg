<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="gl-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#1f0a02"/>
      <stop offset="100%" stop-color="#0a0300"/>
    </radialGradient>
    <linearGradient id="gl-crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="gl-diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="gl-glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Solar Radiant Rays -->
  <g stroke="#f59e0b" stroke-width="4" opacity="0.4" filter="url(#gl-glow)">
    <line x1="250" y1="10" x2="250" y2="490"/>
    <line x1="10" y1="250" x2="490" y2="250"/>
    <line x1="80" y1="80" x2="420" y2="420"/>
    <line x1="420" y1="80" x2="80" y2="420"/>
  </g>

  <!-- Outer Ring with Jewels -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#fef08a" stroke-width="6" filter="url(#gl-glow)"/>
  <circle cx="250" cy="250" r="222" fill="url(#gl-bg)" stroke="url(#gl-crown)" stroke-width="18"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="14 10"/>
  <circle cx="250" cy="250" r="165" fill="#1c0701" stroke="url(#gl-crown)" stroke-width="5"/>

  <!-- Ornate Golden Imperial Crown -->
  <g transform="translate(130, 160)" filter="url(#gl-glow)">
    <!-- Base Arch -->
    <path d="M 20 150 Q 120 175 220 150 L 225 125 Q 120 145 15 125 Z" fill="url(#gl-crown)" stroke="#fff" stroke-width="2"/>
    
    <!-- Crown Spikes -->
    <path d="M 15 125 L 10 50 L 55 90 L 120 10 L 185 90 L 230 50 L 225 125 Q 120 145 15 125 Z" fill="url(#gl-crown)" stroke="#fff" stroke-width="2"/>

    <!-- Jewels on Peaks -->
    <!-- Center Peak Big Diamond -->
    <polygon points="120,5 130,20 120,35 110,20" fill="url(#gl-diamond)" stroke="#fff" stroke-width="1.5"/>
    <!-- Left Peaks -->
    <circle cx="10" cy="50" r="9" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
    <circle cx="55" cy="90" r="7" fill="url(#gl-diamond)" stroke="#fff" stroke-width="1.5"/>
    <!-- Right Peaks -->
    <circle cx="230" cy="50" r="9" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
    <circle cx="185" cy="90" r="7" fill="url(#gl-diamond)" stroke="#fff" stroke-width="1.5"/>

    <!-- Base Row Gemstones -->
    <circle cx="60" cy="140" r="6" fill="#3b82f6"/>
    <circle cx="90" cy="145" r="6" fill="#ef4444"/>
    <circle cx="120" cy="147" r="8" fill="url(#gl-diamond)"/>
    <circle cx="150" cy="145" r="6" fill="#ef4444"/>
    <circle cx="180" cy="140" r="6" fill="#3b82f6"/>
  </g>

  <!-- Big Diamond Starburst below Crown -->
  <polygon points="250,335 258,355 278,355 262,367 268,387 250,375 232,387 238,367 222,355 242,355" fill="url(#gl-crown)" filter="url(#gl-glow)"/>
</svg>