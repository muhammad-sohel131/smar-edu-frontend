<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="tv-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="60%" stop-color="#1e0538"/>
      <stop offset="100%" stop-color="#0a0014"/>
    </radialGradient>
    <linearGradient id="tv-plat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="tv-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="tv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Rim Glow -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#a855f7" stroke-width="4" opacity="0.6" filter="url(#tv-glow)"/>
  <!-- Beveled Platinum Outer Rim -->
  <circle cx="250" cy="250" r="225" fill="url(#tv-bg)" stroke="url(#tv-plat)" stroke-width="16"/>
  <!-- Inner Ring with tick marks -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>
  <circle cx="250" cy="250" r="180" fill="#130324" stroke="url(#tv-gold)" stroke-width="4"/>
  
  <!-- Cyber Wings -->
  <g fill="url(#tv-plat)" opacity="0.9" filter="url(#tv-glow)">
    <!-- Left Wing -->
    <path d="M 170 230 C 110 200, 70 240, 50 280 C 90 280, 130 260, 170 240 Z" />
    <path d="M 160 255 C 100 245, 75 285, 65 315 C 100 305, 135 285, 160 265 Z" />
    <path d="M 155 280 C 110 280, 90 310, 85 340 C 115 325, 140 305, 155 290 Z" />
    <!-- Right Wing -->
    <path d="M 330 230 C 390 200, 430 240, 450 280 C 410 280, 370 260, 330 240 Z" />
    <path d="M 340 255 C 400 245, 425 285, 435 315 C 400 305, 365 285, 340 265 Z" />
    <path d="M 345 280 C 390 280, 410 310, 415 340 C 385 325, 360 305, 345 290 Z" />
  </g>

  <!-- Central Shield -->
  <path d="M 250 120 L 320 160 L 320 280 Q 250 360 250 380 Q 250 360 180 280 L 180 160 Z" fill="#240742" stroke="url(#tv-gold)" stroke-width="6"/>
  
  <!-- Golden Lightning Bolt -->
  <polygon points="265,140 215,245 255,245 235,355 295,230 255,230" fill="url(#tv-gold)" filter="url(#tv-glow)"/>
  
  <!-- Sparks & Stars -->
  <circle cx="250" cy="100" r="6" fill="#fef08a" filter="url(#tv-glow)"/>
  <circle cx="160" cy="180" r="4" fill="#c084fc"/>
  <circle cx="340" cy="180" r="4" fill="#c084fc"/>
  <circle cx="250" cy="405" r="5" fill="#fef08a"/>
</svg>